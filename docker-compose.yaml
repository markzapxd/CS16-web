services:
  game-data:
    build:
      context: .
      dockerfile: build/data-init.Dockerfile
    volumes:
      - game-data:/data
    restart: "no"
  cs16:
    depends_on:
      game-data:
        condition: service_completed_successfully
    image: ${CS16_IMAGE:-ghcr.io/markzapxd/cs16-web/source-cs16@sha256:72fe248d3daab64af36429c1ff61d07a67ef90c27019add53ca88ed0aa726fa6}
    platform: linux/amd64
    environment:
      MAP: ${MAP:-garten_v05}
      MAXPLAYERS: ${MAXPLAYERS:-16}
      IP: ${ADVERTISED_IP:-}
      PORT: "27018"
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:27016/tcp"
      - "27018:27018/udp"
      - "27018:27018/tcp"
    volumes:
      - game-data:/game-data:ro
      - type: bind
        source: ${CONTENT_DIR:-./custom-content}
        target: /content
        read_only: true
        bind:
          create_host_path: true
    restart: unless-stopped

volumes:
  game-data:
