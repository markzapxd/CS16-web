services:
  cs16:
    image: ${CS16_IMAGE:-ghcr.io/markzapxd/cs16-web/portable-cs16:sha-b125113}
    platform: linux/amd64
    environment:
      MAP: ${MAP:-de_dust2}
      MAXPLAYERS: ${MAXPLAYERS:-16}
      IP: ${ADVERTISED_IP:-127.0.0.1}
      PORT: "27018"
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:27016/tcp"
      - "27018:27018/udp"
      - "27018:27018/tcp"
    volumes:
      - type: bind
        source: ${CONTENT_DIR:-./custom-content}
        target: /content
        read_only: true
        bind:
          create_host_path: true
    restart: unless-stopped
