<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="/main.ts"></script>
    <link rel="stylesheet" href="style.css">

    <title>Play CStrike - Server Loading</title>
    <link rel="icon" href="media/cstrike.ico">

</head>
<body>

<div class="pregame-info">

    <img id="logo" src="/logo.png" alt="Counter-Strike" width="160">
    <div id="social"></div>
    <div class="loading-bar">
        <p>Downloading... may take a few minutes</p>
        <progress id="progress" value="0" max="1"></progress>
    </div>

</div>




<canvas id="canvas">
</canvas>
<p id="warning" class="notDraggable">If it's not starting, try to enable microphone and refresh</p>
<form id="form">
    <div>
        <label>
            Player name
            <input id="username" type="text" required placeholder="username?"/>
        </label>
        <label><input id="touchControls" type="checkbox"> Touch controls</label>
        <button type="submit">
            Start
        </button>
    </div>
</form>
</body>

</html>
